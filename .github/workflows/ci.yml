name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.10"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate commands metadata
        run: bun run generate

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun test

      - name: Build
        run: bun run build

  build-binaries:
    name: Build Binaries
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.10"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build standalone binaries
        run: bun run build:binaries

      - name: Smoke test linux binary
        run: ./dist/linux-x64/cli --help

      - name: Upload binary artifacts
        uses: actions/upload-artifact@v4
        with:
          name: agentree-binaries
          path: |
            dist/darwin-arm64/cli
            dist/darwin-x64/cli
            dist/linux-arm64/cli
            dist/linux-x64/cli
            dist/windows-x64/cli.exe
